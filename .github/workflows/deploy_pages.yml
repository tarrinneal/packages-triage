name: Deploy PR Triage Report to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Every Tuesday at 12:37 PM Pacific (19:37 UTC during PDT, 20:37 UTC during PST),
    # scheduled off-peak so the report is ready before 1:00 PM Pacific.
    - cron: '37 19 * * 2'
    - cron: '37 20 * * 2'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check Pacific Daylight/Standard Time and 5-minute cooldown
        id: tz_check
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            tz_abbr=$(TZ=America/Los_Angeles date +%Z)
            if [ "${{ github.event.schedule }}" = "37 19 * * 2" ] && [ "$tz_abbr" = "PDT" ]; then
              :
            elif [ "${{ github.event.schedule }}" = "37 20 * * 2" ] && [ "$tz_abbr" = "PST" ]; then
              :
            else
              echo "Skipping ${{ github.event.schedule }} because America/Los_Angeles is currently in $tz_abbr."
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if ! python3 - "${{ github.repository }}" "${{ github.run_id }}" <<'PY'
          import datetime, json, sys, urllib.request
          repo, current_run_id = sys.argv[1], int(sys.argv[2])
          url = f"https://api.github.com/repos/{repo}/actions/workflows/deploy_pages.yml/runs?per_page=10"
          try:
              req = urllib.request.Request(url, headers={"Accept": "application/vnd.github+json", "User-Agent": "packages-triage"})
              with urllib.request.urlopen(req, timeout=10) as resp:
                  runs = json.loads(resp.read().decode()).get("workflow_runs", [])
          except Exception as e:
              print(f"Warning: could not check recent runs ({e}); allowing run.")
              sys.exit(0)
          now = datetime.datetime.now(datetime.timezone.utc)
          for run in runs:
              if run.get("id") == current_run_id or run.get("conclusion") != "success":
                  continue
              started = datetime.datetime.fromisoformat(run["run_started_at"].replace("Z", "+00:00"))
              updated = datetime.datetime.fromisoformat(run["updated_at"].replace("Z", "+00:00"))
              # Ignore runs that were skipped by tz_check (which finish in < 20s without deploying).
              if (updated - started).total_seconds() < 20:
                  continue
              elapsed = (now - updated).total_seconds()
              if elapsed < 300:
                  print(f"Skipping because run #{run.get('run_number')} finished {int(elapsed)}s ago (< 300s minimum interval).")
                  sys.exit(1)
              break
          PY
          then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "should_run=true" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: steps.tz_check.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Set up Dart
        if: steps.tz_check.outputs.should_run == 'true'
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        if: steps.tz_check.outputs.should_run == 'true'
        run: dart pub get

      - name: Configure GitHub Pages
        if: steps.tz_check.outputs.should_run == 'true'
        id: pages
        uses: actions/configure-pages@v5

      - name: Restore PR detail cache and previous report state
        if: steps.tz_check.outputs.should_run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/pr_inspector
            site/index.state.json
          key: triage-state-${{ github.run_id }}
          restore-keys: |
            triage-state-

      - name: Fetch previous report state from live Pages site if cache expired
        if: steps.tz_check.outputs.should_run == 'true'
        run: |
          mkdir -p site
          if [ ! -f site/index.state.json ]; then
            curl -fsSL "${{ steps.pages.outputs.base_url }}/index.state.json" -o site/index.state.json || true
          fi

      - name: Generate HTML triage report
        if: steps.tz_check.outputs.should_run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRIAGE_REPOS: ${{ vars.TRIAGE_REPOS }}
          TRIAGE_TEAM_LABEL: ${{ vars.TRIAGE_TEAM_LABEL }}
          TRIAGE_FYI_LABEL: ${{ vars.TRIAGE_FYI_LABEL }}
          TRIAGE_TRIAGED_LABEL: ${{ vars.TRIAGE_TRIAGED_LABEL }}
          TRIAGE_REQUIRED_APPROVALS: ${{ vars.TRIAGE_REQUIRED_APPROVALS }}
          TZ: America/Los_Angeles
        run: dart run bin/pr_inspector.dart --html site/index.html

      - name: Save PR detail cache and report state
        if: always() && steps.tz_check.outputs.should_run == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/pr_inspector
            site/index.state.json
          key: triage-state-${{ github.run_id }}

      - name: Upload Pages artifact
        if: steps.tz_check.outputs.should_run == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        if: steps.tz_check.outputs.should_run == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
