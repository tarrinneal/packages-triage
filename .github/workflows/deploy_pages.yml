name: Deploy PR Triage Report to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Synced from configs/*.dart (edit refreshSchedule in configs/<name>.dart):
    - cron: '37 19 * * 2' # ecosystem
  workflow_dispatch:
    inputs:
      config:
        description: 'Config name to refresh (leave empty to refresh all configs)'
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check 5-minute cooldown for manual dispatch
        id: tz_check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if ! python3 - "${{ github.repository }}" "${{ github.run_id }}" <<'PY'
          import datetime, json, sys, urllib.request
          repo, current_run_id = sys.argv[1], int(sys.argv[2])
          url = f"https://api.github.com/repos/{repo}/actions/workflows/deploy_pages.yml/runs?per_page=10"
          try:
              req = urllib.request.Request(url, headers={"Accept": "application/vnd.github+json", "User-Agent": "packages-triage"})
              with urllib.request.urlopen(req, timeout=10) as resp:
                  runs = json.loads(resp.read().decode()).get("workflow_runs", [])
          except Exception as e:
              print(f"Warning: could not check recent runs ({e}); allowing run.")
              sys.exit(0)
          now = datetime.datetime.now(datetime.timezone.utc)
          for run in runs:
              if run.get("id") == current_run_id or run.get("conclusion") != "success":
                  continue
              started = datetime.datetime.fromisoformat(run["run_started_at"].replace("Z", "+00:00"))
              updated = datetime.datetime.fromisoformat(run["updated_at"].replace("Z", "+00:00"))
              if (updated - started).total_seconds() < 20:
                  continue
              elapsed = (now - updated).total_seconds()
              if elapsed < 300:
                  print(f"Skipping because run #{run.get('run_number')} finished {int(elapsed)}s ago (< 300s minimum interval).")
                  sys.exit(1)
              break
          PY
            then
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "should_run=true" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: steps.tz_check.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Set up Dart
        if: steps.tz_check.outputs.should_run == 'true'
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        if: steps.tz_check.outputs.should_run == 'true'
        run: dart pub get

      - name: Configure GitHub Pages
        if: steps.tz_check.outputs.should_run == 'true'
        id: pages
        uses: actions/configure-pages@v5

      - name: Restore PR detail cache and existing site pages
        if: steps.tz_check.outputs.should_run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/pr_inspector
            site
          key: triage-state-${{ github.run_id }}
          restore-keys: |
            triage-state-

      - name: Fetch existing pages and report state from live Pages site if missing from cache
        if: steps.tz_check.outputs.should_run == 'true'
        run: |
          mkdir -p site
          for page in index.html index_team.html index_issues.html index.state.json; do
            if [ ! -f "site/$page" ]; then
              curl -fsSL "${{ steps.pages.outputs.base_url }}/$page" -o "site/$page" || true
            fi
          done
          for cfg in configs/*.dart; do
            [ -f "$cfg" ] || continue
            name="$(basename "$cfg" .dart)"
            mkdir -p "site/$name"
            for page in index.html index_team.html index_issues.html index.state.json; do
              if [ ! -f "site/$name/$page" ]; then
                curl -fsSL "${{ steps.pages.outputs.base_url }}/$name/$page" -o "site/$name/$page" || true
              fi
            done
          done

      - name: Sync teamMembers and generate HTML triage report
        if: steps.tz_check.outputs.should_run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TZ: America/Los_Angeles
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_CONFIG: ${{ inputs.config }}
        run: |
          TARGET_ARGS=()
          if [ "$EVENT_NAME" = "schedule" ] && [ -n "$EVENT_SCHEDULE" ]; then
            TARGET_ARGS=(--only-schedule "$EVENT_SCHEDULE")
          elif [ -n "$INPUT_CONFIG" ]; then
            TARGET_ARGS=(--only "$INPUT_CONFIG")
          fi
          dart run bin/sync_reviewers.dart "${TARGET_ARGS[@]}"
          if [[ -n "$(git status --porcelain -- configs/ lib/config.dart .github/workflows/deploy_pages.yml)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add configs/ lib/config.dart .github/workflows/deploy_pages.yml
            git commit -m "Sync teamMembers from SUGGESTED_REVIEWERS.md [skip ci]"
            git push origin HEAD:main || true
          fi
          dart run bin/pr_inspector.dart --html site/index.html "${TARGET_ARGS[@]}"

      - name: Save PR detail cache and site pages
        if: always() && steps.tz_check.outputs.should_run == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/pr_inspector
            site
          key: triage-state-${{ github.run_id }}

      - name: Upload Pages artifact
        if: steps.tz_check.outputs.should_run == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        if: steps.tz_check.outputs.should_run == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
